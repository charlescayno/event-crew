<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#121b33;--bg2:#0b1220;--card:#1b2238;--inner:rgba(17,26,47,.9);--hover:#222b45;--sel:#2b3554;
  --text:#e6edf7;--mute:rgba(255,255,255,.55);--label:rgba(255,255,255,.5);
  --pink:#db2777;--pink-glow:rgba(219,39,119,.35);--amber:#f0b46a;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:light){
  :root{--bg1:#f7f7fb;--bg2:#eef0f7;--card:#fff;--inner:#f3f4fa;--hover:#eceef8;--sel:#e6e8f4;
    --text:#18203a;--mute:#6b7290;--label:#6b7290;--pink-glow:rgba(219,39,119,.2)}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:400 15px/22px Nunito,system-ui,sans-serif;
  background:radial-gradient(circle at top,var(--bg1),var(--bg2)) fixed;
  padding:24px 16px calc(32px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font:italic 400 34px/40px "Editors Note",Georgia,serif;margin:8px 0 4px}
h1 b{color:var(--pink);font-weight:400}
.sub{color:var(--mute);margin:0 0 16px}
.label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--label)}
input{width:100%;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--text);
  padding:0 14px;font:600 15px Nunito,sans-serif;outline:none;margin-bottom:12px}
input::placeholder{color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tab{border:0;border-radius:12px;background:var(--card);color:var(--text);height:64px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;
  transition:transform .2s var(--ease),background .2s}
.tab:hover{background:var(--hover)}.tab:active{transform:scale(.97)}
.tab .n{font-size:20px;font-weight:800}.tab .label{font-size:10px}
.tab[aria-pressed=true]{background:var(--sel)}.tab[aria-pressed=true] .n{color:var(--pink)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;animation:rise .42s var(--ease) both}
.card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{font-size:11px;font-weight:700;color:var(--mute)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;
  background:var(--inner);border-radius:12px;padding:12px 14px;margin-top:8px}
.slot{font-weight:800;color:var(--mute)}
.name{font-weight:700}
.name.vacant{color:var(--mute);font-weight:400}
.tag{font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 8px;border-radius:8px;background:var(--sel)}
.tag.bcr{color:var(--pink)}
.empty{text-align:center;padding:32px 0}
.empty h2{font:italic 400 26px "Editors Note",Georgia,serif;margin:0 0 4px}
.empty p{color:var(--mute);margin:0}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="label">Crew roster</div>
  <h1>Event <b>Crew</b></h1>
  <p class="sub">Who is on which base, and who they talk to on comms.</p>
  <input id="q" type="search" placeholder="Search name, role or slot" aria-label="Search">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const D=[
["Base-A","1-A","4wire Byron",""],["Base-A","2-A","Vacant",""],["Base-A","3-A","Vacant",""],["Base-A","4-A","Vacant",""],
["Base-A","5-A","Vacant",""],["Base-A","6-A","Vacant",""],["Base-A","7-A","Vacant",""],["Base-A","8-A","Vacant",""],
["Base-B","B1","Cam 1",""],["Base-B","B2","Cam 2",""],["Base-B","B3","Cam 3",""],["Base-B","B4","Cam 4",""],
["Base-B","B5","Cam 5",""],["Base-B","B6","Cam 6",""],["Base-B","B7","Cam 7",""],["Base-B","B8","Cam 8",""],
["Base-C","C1","Cam 9",""],["Base-C","C2","Cam 10",""],["Base-C","C3","Cam 11",""],["Base-C","C4","Cam Technical Director",""],
["Base-C","C5","Camera Director",""],["Base-C","C6","Lights",""],["Base-C","C7","Lights",""],["Base-C","C8","Tech Support",""],
["Synco","1","Marco",""],["Synco","2","Cathmeg",""],["Synco","3","Speaker Care",""],["Synco","4","4-4 wire (vacant)",""],
["Synco","5","Rey Mediante",""],["Synco","6","Jaypee Macasa",""],["Synco","7","FOH - Graphics Producer","BCR"],
["Synco","8","BCR - Graphics Producer","SB"],["Synco","9","SM",""],["Synco","10","Assistant Stage Manager",""],
["Synco","11","Assistant Stage Manager",""],["Synco","12","Stage Mentor",""],["Synco","13","BCR Switcher","BCR"],
["Synco","14","Kristine","SB"],["Synco","15","BCR Playback","BCR"],["Synco","16","BCR Teleprompter","BCR"],
["Synco","17","Innah",""],["Synco","18","Audio - FOH Assist",""],["Synco","19","Audio - BC Mix",""],["Synco","20","Audio - RF Tech",""]
];
const COMMS={BCR:"BCR",SB:"Sound Booth"};
const divs=["All","Base-A","Base-B","Base-C","Synco"];
let sel="All";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tabs(){
  $("tabs").innerHTML=divs.map(d=>{
    const n=d==="All"?D.length:D.filter(r=>r[0]===d).length;
    return `<button class="tab" data-d="${d}" aria-pressed="${d===sel}"><span class="n">${n}</span><span class="label">${d==="All"?"All":d.replace("Base-","Base ")}</span></button>`}).join("");
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const rows=D.filter(r=>(sel==="All"||r[0]===sel)&&(!q||r.join(" ").toLowerCase().includes(q)));
  if(!rows.length){$("list").innerHTML='<div class="empty"><h2>No match</h2><p>Try another name, role or slot.</p></div>';return}
  const groups={};rows.forEach(r=>(groups[r[0]]??=[]).push(r));
  $("list").innerHTML=Object.entries(groups).map(([g,rs])=>`
    <section class="card"><header><span class="label">${g}</span><span class="pill">${rs.length} slots</span></header>
    ${rs.map(r=>`<div class="row"><span class="slot">${esc(r[1])}</span>
      <span class="name${/vacant/i.test(r[2])?" vacant":""}">${esc(r[2])}</span>
      ${r[3]?`<span class="tag ${r[3]==="BCR"?"bcr":""}" title="Comms connected to ${COMMS[r[3]]}">${r[3]}</span>`:""}</div>`).join("")}
    </section>`).join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;sel=b.dataset.d;tabs();render()});
$("q").addEventListener("input",render);
tabs();render();
</script>
</body>
</html>
